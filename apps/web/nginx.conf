# Cairn Web 统一入口：静态前端 + /api 反向代理
# HTTPS 配置见 docs/DEPLOYMENT.md「HTTPS」章节（含证书挂载与 443 server 块模板）
server {
    listen 80;
    server_name _;

    # 多文件上传、DeepSeek ZIP 导入
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # certbot HTTP-01 验证目录（方案 B 使用；未挂载时仅 404，不影响其余路由）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 带内容指纹的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE（复盘进度 / 流式输出）必须关闭缓冲，否则前端看不到逐字输出
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

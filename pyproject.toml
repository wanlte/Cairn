[project]
name = "cairn-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pgvector>=0.2.5",
  "redis>=5.0",
  "structlog>=24.1",
  "pyjwt>=2.8",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
  "email-validator>=2.1",
  "openai>=1.40",
  "aiobreaker>=1.1",
  "jieba>=0.42",
  "langchain-core>=0.3.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "detect-secrets>=1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api"]
